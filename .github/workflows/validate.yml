name: Validate Windows UI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse all scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            # Match launcher.ps1: legacy sources are UTF-8, even before BOM normalization.
            $source = [System.IO.File]::ReadAllText($_.FullName, [System.Text.Encoding]::UTF8)
            [void][System.Management.Automation.Language.Parser]::ParseInput($source, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count) { throw ($_.FullName + ': ' + ($parseErrors.Message -join '; ')) }
          }
      - name: Check quota and stale-data behavior
        shell: powershell
        run: |
          ./tests/ui-model.tests.ps1
          ./tests/ui-behavior.tests.ps1
          ./tests/remote-notifications.tests.ps1
          ./tests/mobile-sync.tests.ps1
          ./tests/codex-tools.tests.ps1
      - name: Validate static mobile PWA and Web Crypto fixtures
        shell: powershell
        run: |
          node --check mobile/crypto.js
          node --check mobile/model.js
          node --check mobile/app.js
          node --check mobile/sw.js
          node tests/mobile.tests.js
      - name: Render native UI and exercise resize and failure states
        shell: powershell
        run: ./tray.ps1 -SmokeTest
      - name: Build standalone desktop EXE
        shell: powershell
        run: ./desktop/build.ps1
      - name: Verify packaged client, settings migration and update integrity
        shell: powershell
        run: |
          $root = Join-Path (Get-Location) 'artifacts/client-self-test'
          $client = Start-Process -FilePath ./dist/CodexUsage.exe -ArgumentList ('--self-test "' + $root + '"') -PassThru
          if (-not $client.WaitForExit(120000)) { $client.Kill(); throw 'Packaged client test timed out.' }
          Get-Content (Join-Path $root 'client-test.txt')
          if ($client.ExitCode -ne 0) { throw 'Packaged client test failed.' }
      - name: Upload desktop distribution
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop
          path: dist/
      - name: Upload fixture screenshots and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ui-preview
          path: |
            artifacts/*.png
            artifacts/client-self-test/client-test.txt
            artifacts/client-self-test/installer.png
            artifacts/client-self-test/data/logs/*.log
            artifacts/client-self-test/app/*/artifacts/*.png
            logs/*.log

  publish:
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-desktop
          path: dist
      - name: Publish a complete versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(tr -d '\r\n' < dist/VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          exists=false
          if draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$draft" == false ]]; then
              echo "Release $tag already exists; published binaries are immutable."
              exit 0
            fi
            exists=true
          fi
          cat > release-notes.md <<'NOTES'
          Windows 10/11 desktop client. Download **CodexUsage.exe** and double-click it. Confirm “安装并启动” on first launch. Installation is per-user and creates shortcuts; no administrator access is needed. Windows Settings → Apps now includes an uninstall entry that preserves settings and account data.

          v0.9.4 统一桌面与手机的低额度显示：正数不足 1% 显示为 <1%，只有实际耗尽才显示 0%。新增“清晰模式（不透明）”和“悬浮窗大小 → 小 / 中 / 大”，设置会保留。打包客户端最多并行读取两个账号，先完成的账号立即更新，另一个保留上次成功值；悬停显示各账号最近更新时间。

          增加显示器变化和睡眠恢复后的窗口恢复，恢复时重新读取额度。自动化覆盖三档大小、四种 DPI、模拟拔屏、分辨率变化、睡眠恢复和设置重载；当前实机只有一块显示器，混合 DPI 的物理多屏切换尚未验证。保留 v0.9.3 的首次启动窄窗、两行标签与长周期重置时间修复。

          保留 v0.9.2 的圆环自由拖动和四边吸附，以及 Windows 后台同步修复。保留 iPhone / Mobile PWA：Windows 端发送严格脱敏的额度快照，通过独立 ntfy topic 本地加密；手机使用 Web Crypto 验证并解密。手机同步可以独立启用，并包含重复抑制、五分钟心跳和网络退避；保留跨电脑完成通知。

          后续版本在后台自动检查和下载，右键选择“客户端更新 → 重启并更新”生效，也可退出后自动安装。额度每分钟刷新一次；保留紧凑模式、透明度设置、贴边吸附与低额度通知。

          小窗同时显示 5h / 长周期剩余，分别着色；5h 用尽时显示恢复倒计时，悬停查看本机时区的准确时刻。支持单账号、自定义名称和首次使用引导。右键可开启开机启动与全屏隐藏。新增跨屏 DPI 处理、更新下载进度和可重试的错误说明。

          首次从脚本版升级请先退出旧程序。将 EXE 放在旧版本目录首次运行，可自动迁移 ui-settings.json 和 profiles.json。现有账号凭据继续保留在用户的 .codex-personal / .codex-work 目录。

          分享给朋友请发送本发布页链接，每个人登录自己的账号。详细步骤见 READ-ME.txt。额度读取、更新与窗口适配已使用 C#，界面和登录引导仍使用 PowerShell；这是渐进迁移。

          This build is unsigned. The SHA-256 digest is in SHA256SUMS.txt and update.json. Windows may show a publisher/reputation prompt on first launch.
          NOTES
          if [[ "$exists" == false ]]; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Codex Usage $tag" --notes-file release-notes.md --draft
          fi
          gh release upload "$tag" dist/CodexUsage.exe dist/update.json dist/SHA256SUMS.txt dist/READ-ME.txt --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest

